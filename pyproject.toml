[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "qspquest-models"
version = "0.1.0"
description = "Curated OMEX models for standalone QSPQuest simulation"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
[tool.setuptools]
packages = ["qspquest_models"]
[tool.setuptools.package-data]
qspquest_models = ["user_guides.json", "availability.json"]
